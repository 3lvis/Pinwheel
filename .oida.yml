# The linter is oida (github.com/kolonialno/oida-swift), a SwiftLint fork carrying the rules we
# actually want. bin/lint fetches the pinned release and runs it; there is no baseline, so the tree
# is kept at zero and any violation fails.

opt_in_rules:
  # The shape of every argument list, parameter list and condition: three or more elements go one per
  # line, two or fewer go on one line, and both directions hold.
  - multiline_call_arguments
  - multiline_parameters
  - multiline_conditions
  # Imports in three groups — Apple, ours, third-party — alphabetical inside each. Correctable.
  - grouped_imports
  - key_path_only_where_the_api_takes_one
  - multiline_string_opens_on_its_own_line
  # What gets written too much of: a helper with one caller that returns nothing, a comment whose every
  # word is already in the code below it, a banner naming what the declarations already name.
  - comment_adds_no_word
  - no_mark_comments
  - no_single_use_void_functions
  # VOICE.md's own contract, enforced on every document this repository writes.
  - document_says_what_is
  - document_avoids_retired_words
  - document_links_resolve

disabled_rules:
  - todo # work is tracked in PRs and LEARNINGS, not in-code markers
  - unused_closure_parameter

excluded:
  # Never lint vendored or generated code, wherever the build puts it. Matched by location, not path,
  # so an in-repo `-derivedDataPath` does not drag SPM checkouts into scope.
  - DerivedData
  - build
  - "**/.build"
  - "**/SourcePackages"
  - "**/GeneratedSources"
  - "**/Intermediates.noindex"
  - figma-plugin/node_modules

# VOICE.md governs the documents this repository publishes about itself: the root ones and every
# LEARNINGS note. A README sitting beside a tool belongs to that tool, docs/ holds working notes, and
# .claude and .github hold agent instructions — all of which VOICE.md leaves alone, the way tienda-ios
# scopes it. Written as an exclusion of interior directories rather than an `included` pattern naming
# the repository, which would match the checkout directory and so lint nothing from a worktree named
# after its branch. A dead link is a defect anywhere, so document_links_resolve stays unscoped.
document_says_what_is:
  severity: error
  excluded: "/(docs|\\.claude|\\.github|figma-plugin|Demo|DemoCatalog|DemoTests|Pinwheel)/"

document_avoids_retired_words:
  severity: error
  excluded: "/(docs|\\.claude|\\.github|figma-plugin|Demo|DemoCatalog|DemoTests|Pinwheel)/"

# Errors, not warnings: what these find is written by whoever is not reading the code around it, and a
# warning is what a reader scrolls past.
comment_adds_no_word:
  severity: error
no_mark_comments:
  severity: error

opening_brace:
  # A condition spanning several lines gets its brace on its own line, so the body is not mistaken for
  # another condition. That is what the formatter emits.
  ignore_multiline_statement_conditions: true

# A `Device.Kind` case carries the marketing names of the phones that share one screen, and the
# underscore is the slash in "iPhone 12/13 mini" — the only punctuation a case name can hold.
identifier_name:
  min_length: 1
  max_length: 70
  allowed_symbols: ["_"]

type_name:
  max_length: 45

multiline_call_arguments:
  max_number_of_single_line_parameters: 2

multiline_parameters:
  max_number_of_single_line_parameters: 2

multiline_conditions:
  max_number_of_single_line_parameters: 2

grouped_imports:
  # This repository's library, its demo app and the catalog the demo draws from. Anything unlisted is
  # third-party.
  our_modules:
    - Demo
    - DemoCatalog
    - Pinwheel
